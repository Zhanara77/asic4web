<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Café table reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="train-page">
<main class="container py-4">
  <section class="train-card mx-auto">
    <header class="train-header"><h1 class="h5 mb-0">Reserve a table</h1></header>
    <form class="p-3 p-md-4" action="#" method="get">
      <div class="row g-3">
        <div class="col-12 col-md-6"><label class="form-label" for="name">Your name *</label><input class="form-control" type="text" id="name" name="name" autocomplete="name" required></div>
        <div class="col-12 col-md-6"><label class="form-label" for="email">Email *</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required></div>
        <div class="col-12 col-md-6"><label class="form-label" for="phone">Phone *</label><input class="form-control" type="tel" id="phone" name="phone" autocomplete="tel" required></div>
        <div class="col-12 col-md-6"><label class="form-label" for="guests">Guests *</label><input class="form-control" type="number" id="guests" name="guests" min="1" max="20" step="1" required></div>
        <div class="col-12 col-md-6"><label class="form-label" for="date">Date *</label><input class="form-control" type="date" id="date" name="date" required></div>
        <fieldset class="col-12 col-md-6">
          <legend class="form-label">Seating *</legend>
          <div class="d-flex gap-3 flex-wrap">
            <div class="form-check"><input class="form-check-input" type="radio" name="seating" id="inside" value="inside" required><label class="form-check-label" for="inside">Inside</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" name="seating" id="terrace" value="terrace" required><label class="form-check-label" for="terrace">Terrace</label></div>
          </div>
        </fieldset>
        <div class="col-12 col-md-6"><label class="form-label" for="time">Time *</label><select class="form-select" id="time" name="time" required><option value="" selected disabled>Choose a time…</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option></select></div>
        <div class="col-12"><label class="form-label" for="comments">Comments (optional)</label><textarea class="form-control" id="comments" name="comments" rows="3" placeholder="Special requests"></textarea></div>
        <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="terms" name="terms" required><label class="form-check-label" for="terms">I agree to the reservation terms *</label></div></div>
        <div class="col-12"><button class="btn btn-find" type="submit">Reserve</button> <button class="btn btn-clear" type="reset">Clear</button></div>
      </div>
    </form>
  </section>
</main>
</body></html>
