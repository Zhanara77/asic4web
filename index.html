<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="train-page">
  <main class="container py-4 py-lg-5">
    <section class="train-card mx-auto">
      <header class="train-header"><h1 class="h5 mb-0">Book a train ticket</h1></header>
      <form class="p-3 p-md-4" action="#" method="get">
        <fieldset class="mb-3">
          <legend class="visually-hidden">Trip type</legend>
          <div class="btn-group trip-toggle" role="group" aria-label="Trip type">
            <input class="btn-check" type="radio" name="trip" id="one-way" value="one-way" checked>
            <label class="btn" for="one-way">One way</label>
            <input class="btn-check" type="radio" name="trip" id="round-trip" value="round-trip">
            <label class="btn" for="round-trip">Round trip</label>
          </div>
        </fieldset>

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label for="from" class="form-label">From</label>
            <input class="form-control" id="from" name="from" value="Astana" required>
          </div>
          <div class="col-12 col-md-6">
            <label for="to" class="form-label">To</label>
            <input class="form-control" id="to" name="to" value="Almaty" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-4">
            <label for="departure" class="form-label">Departure</label>
            <input class="form-control" type="date" id="departure" name="departure" required>
          </div>
          <div class="col-12 col-md-4">
            <label for="return" class="form-label">Return</label>
            <input class="form-control" type="date" id="return" name="return">
          </div>
          <div class="col-12 col-md-4">
            <label for="passengers" class="form-label">Passengers</label>
            <select class="form-select" id="passengers" name="passengers" required>
              <option value="1" selected>1 adult</option>
              <option value="2">2 adults</option><option value="3">3 adults</option>
              <option value="4">4 adults</option><option value="5">5 adults</option><option value="6">6 adults</option>
            </select>
          </div>
        </div>

        <fieldset class="mb-3">
          <legend class="form-label">Carriage class</legend>
          <div class="d-flex flex-wrap gap-3">
            <div class="form-check"><input class="form-check-input" type="radio" id="seat" name="class" value="seat"><label class="form-check-label" for="seat">Seat</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" id="coupe" name="class" value="coupe" checked><label class="form-check-label" for="coupe">Coupé</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" id="sleeper" name="class" value="sleeper"><label class="form-check-label" for="sleeper">Sleeper</label></div>
          </div>
        </fieldset>

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <div class="input-group"><span class="input-group-text">+7</span><input class="form-control" type="tel" id="phone" name="phone" placeholder="701 234 56 78" required></div>
          </div>
          <div class="col-12 col-md-6">
            <label for="email" class="form-label">Email</label>
            <input class="form-control" type="email" id="email" name="email" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="sms" name="sms" value="yes">
          <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="agreement" name="agreement" value="yes" required>
          <label class="form-check-label" for="agreement">I agree with the carriage rules</label>
        </div>

        <div class="d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2">
          <button class="btn btn-clear" type="reset">Clear</button>
          <button class="btn btn-find" type="submit">Find trains</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
